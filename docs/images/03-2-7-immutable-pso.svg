<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F8FC"/>
      <stop offset="100%" stop-color="#EEF2F8"/>
    </linearGradient>
    <linearGradient id="psoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-6%" width="108%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="psoShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1D4ED8" flood-opacity="0.22"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
      .title { font-size: 40px; font-weight: 700; fill: #0F172A; letter-spacing: -0.6px; }
      .panel-title { font-size: 24px; font-weight: 700; fill: #0F172A; }
      .pill-amber { font-size: 15px; font-weight: 700; fill: #B45309; }
      .pill-cyan { font-size: 15px; font-weight: 700; fill: #0369A1; }
      .item-title { font-size: 19px; font-weight: 700; fill: #0F172A; }
      .item-sub { font-size: 15px; font-weight: 500; fill: #475569; }
      .pso-title { font-size: 26px; font-weight: 700; fill: #FFFFFF; }
      .pso-sub { font-size: 16px; font-weight: 500; fill: #DBEAFE; }
      .pso-badge { font-size: 14px; font-weight: 700; fill: #1D4ED8; }
      .foot { font-size: 15px; font-weight: 600; fill: #475569; }
      .amber-tag { font-size: 14px; font-weight: 700; fill: #B45309; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1376" height="768" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="68" y="88" class="font title">0.7. Pre-Compiled State (PSO) vs Dynamic State</text>

  <!-- LEFT PANEL: Pre-Compiled Once -->
  <g filter="url(#cardShadow)">
    <rect x="68" y="132" width="796" height="572" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <rect x="102" y="160" width="218" height="34" rx="17" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="211" y="182" text-anchor="middle" class="font pill-amber">Bootstrap · Baked Once</text>
  <text x="102" y="228" class="font panel-title">Hardware-Fixed Pipeline</text>

  <!-- Input 1: Shader -> GPU ISA -->
  <rect x="102" y="258" width="322" height="96" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.8"/>
  <g transform="translate(122, 284)" stroke="#2563EB" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="36" height="36" rx="8" fill="#EFF6FF"/>
    <path d="M16 16 L11 22 L16 28 M28 16 L33 22 L28 28 M24 14 L20 30"/>
  </g>
  <text x="180" y="301" class="font item-title">Shader → GPU ISA</text>
  <text x="180" y="328" class="font item-sub">Machine Code Compile</text>

  <!-- Input 2: Output Format & Blending -->
  <rect x="102" y="376" width="322" height="96" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.8"/>
  <g transform="translate(122, 402)" stroke="#0EA5E9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="36" height="36" rx="8" fill="#ECFEFF"/>
    <rect x="11" y="11" width="14" height="14" rx="3" fill="#BAE6FD"/>
    <rect x="19" y="19" width="14" height="14" rx="3" fill="#0EA5E9" fill-opacity="0.35"/>
  </g>
  <text x="180" y="419" class="font item-title">Format &amp; Blending</text>
  <text x="180" y="446" class="font item-sub">Render Target &amp; Blend Ops</text>

  <!-- Input 3: Vertex Fetch Layout -->
  <rect x="102" y="494" width="322" height="96" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.8"/>
  <g transform="translate(122, 520)" stroke="#475569" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="36" height="36" rx="8" fill="#F1F5F9"/>
    <rect x="11" y="12" width="22" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="11" y="22" width="22" height="6" rx="2" fill="#94A3B8"/>
    <rect x="11" y="32" width="14" height="3" rx="1.5" fill="#64748B" stroke="none"/>
  </g>
  <text x="180" y="537" class="font item-title">Vertex Fetch Layout</text>
  <text x="180" y="564" class="font item-sub">Attribute &amp; Buffer Binding</text>

  <!-- Merging Arrows -->
  <g fill="none" stroke="#3B82F6" stroke-width="2.8" stroke-linecap="round">
    <path d="M 424 306 C 480 306, 476 392, 524 398" marker-end="url(#arrowBlue)"/>
    <path d="M 424 424 L 524 424" marker-end="url(#arrowBlue)"/>
    <path d="M 424 542 C 480 542, 476 456, 524 450" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Immutable PSO Locked Vault Card -->
  <g filter="url(#psoShadow)">
    <rect x="536" y="278" width="292" height="292" rx="20" fill="url(#psoGrad)"/>
  </g>
  <!-- Padlock Icon -->
  <g transform="translate(650, 308)" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 28 V18 A14 14 0 0 1 46 18 V28"/>
    <rect x="10" y="28" width="44" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.18"/>
    <circle cx="32" cy="43" r="4" fill="#FFFFFF" stroke="none"/>
    <line x1="32" y1="47" x2="32" y2="53"/>
  </g>
  <text x="682" y="418" text-anchor="middle" class="font pso-title">Immutable PSO</text>
  <text x="682" y="448" text-anchor="middle" class="font pso-sub">Pre-Validated Object</text>
  <rect x="564" y="482" width="236" height="40" rx="20" fill="#EFF6FF"/>
  <text x="682" y="507" text-anchor="middle" class="font pso-badge">Zero Per-Frame Recompile</text>

  <!-- Left Panel Footer -->
  <rect x="102" y="622" width="726" height="48" rx="12" fill="#F1F5F9"/>
  <text x="465" y="651" text-anchor="middle" class="font foot">High-cost ISA compilation &amp; validation paid once before the frame loop</text>

  <!-- RIGHT PANEL: Dynamic State -->
  <g filter="url(#cardShadow)">
    <rect x="896" y="132" width="412" height="572" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <rect x="930" y="160" width="198" height="34" rx="17" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="1029" y="182" text-anchor="middle" class="font pill-cyan">Per-Frame · Low Cost</text>
  <text x="930" y="228" class="font panel-title">Dynamic State</text>

  <!-- Dynamic Item 1: Viewport -->
  <rect x="930" y="258" width="344" height="96" rx="14" fill="#F8FAFC" stroke="#BAE6FD" stroke-width="1.8"/>
  <g transform="translate(950, 284)" stroke="#0284C7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="36" height="36" rx="8" fill="#E0F2FE"/>
    <rect x="11" y="13" width="22" height="18" rx="2"/>
    <path d="M15 27 L29 17 M24 17 H29 V22"/>
  </g>
  <text x="1008" y="301" class="font item-title">Viewport</text>
  <text x="1008" y="328" class="font item-sub">Screen Bounds &amp; Depth Range</text>

  <!-- Dynamic Item 2: Scissor Rect -->
  <rect x="930" y="376" width="344" height="96" rx="14" fill="#F8FAFC" stroke="#BAE6FD" stroke-width="1.8"/>
  <g transform="translate(950, 402)" stroke="#0284C7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="36" height="36" rx="8" fill="#E0F2FE"/>
    <rect x="12" y="12" width="20" height="20" rx="2" stroke-dasharray="4,3"/>
  </g>
  <text x="1008" y="419" class="font item-title">Scissor Rect</text>
  <text x="1008" y="446" class="font item-sub">2D Pixel Clipping Window</text>

  <!-- Dynamic Item 3: API-Dependent -->
  <rect x="930" y="494" width="344" height="96" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
  <g transform="translate(950, 520)" stroke="#D97706" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="36" height="36" rx="8" fill="#FEF3C7"/>
    <line x1="12" y1="16" x2="32" y2="16"/><circle cx="24" cy="16" r="3" fill="#D97706"/>
    <line x1="12" y1="28" x2="32" y2="28"/><circle cx="18" cy="28" r="3" fill="#D97706"/>
  </g>
  <text x="1008" y="537" class="font item-title">Cull / Winding</text>
  <text x="1008" y="564" class="font amber-tag">API-Dependent Boundary</text>

  <!-- Right Panel Footer -->
  <rect x="930" y="622" width="344" height="48" rx="12" fill="#E0F2FE"/>
  <text x="1102" y="651" text-anchor="middle" class="font pill-cyan">Switched Instantly at Draw Time</text>
</svg>
