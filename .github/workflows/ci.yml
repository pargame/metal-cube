name: Multi-OS Native Build CI (Metal · Direct3D 12 · Vulkan)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS (Metal Native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure & Build (Metal)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build metal_rotating_cube

  build-windows:
    name: Windows (Direct3D 12 + Vulkan Native)
    runs-on: windows-latest
    env:
      VULKAN_SDK_VERSION: "1.4.363.1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache LunarG Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-win-${{ env.VULKAN_SDK_VERSION }}

      - name: Install LunarG Prebuilt Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = $env:VULKAN_SDK_VERSION
          Write-Host "Installing LunarG Vulkan SDK $ver"
          $installer = "$env:TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList "--root", "C:\VulkanSDK\$ver", "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -NoNewWindow -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "Vulkan SDK installer failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }

      - name: Export & Verify Vulkan SDK Environment
        shell: pwsh
        run: |
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path "$sdk\Include\vulkan\vulkan.h")) {
            Write-Error "Vulkan SDK verification failed: $sdk\Include\vulkan\vulkan.h not found"
            exit 1
          }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure & Build (DX12 + Vulkan)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target dx12_rotating_cube vulkan_rotating_cube

  build-linux:
    name: Linux (Vulkan + X11 Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan & X11 dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev glslang-tools libx11-dev

      - name: Configure & Build (Vulkan)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build vulkan_rotating_cube
